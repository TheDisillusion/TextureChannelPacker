name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

jobs:
  windows:
    name: Windows / MSVC
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Export GitHub Actions cache environment for vcpkg
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          .\external\vcpkg\bootstrap-vcpkg.bat -disableMetrics
          "VCPKG_ROOT=$pwd\external\vcpkg" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Set up MSVC dev environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure (core + tests only — Phase 0 scope)
        shell: pwsh
        run: cmake --preset windows-msvc

      - name: Build (Debug)
        shell: pwsh
        run: cmake --build --preset windows-msvc-debug

      - name: Test (Debug)
        shell: pwsh
        run: ctest --preset windows-msvc-debug

      - name: Build (Release)
        shell: pwsh
        run: cmake --build --preset windows-msvc-release

      - name: Test (Release)
        shell: pwsh
        run: ctest --preset windows-msvc-release
